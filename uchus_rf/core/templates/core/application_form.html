{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 fade-in">
            <h3 class="mb-4 text-center">Оформление заявки</h3>
            <form method="POST" novalidate>
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-medium">{{ field.label }}</label>

                    {{ field }}

                    {% if field.errors %}
                        <div class="text-danger small mt-1">
                            {% for error in field.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 mt-3 btn-hover">Отправить заявку</button>
            </form>

            <div class="mt-3 text-center">
                <a href="{% url 'dashboard' %}" class="text-decoration-none small text-muted">Вернуться в личный кабинет</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

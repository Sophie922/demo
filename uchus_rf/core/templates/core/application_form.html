{% extends 'core/base.html' %}
{% block content %}
<div class="card card-custom p-4">
    <h4 class="mb-4 text-center">Оформление заявки</h4>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100 btn-hover">Отправить заявку</button>
    </form>
    <div class="mt-3 text-center">
        <a href="{% url 'dashboard' %}" class="small">Вернуться в личный кабинет</a>
    </div>
</div>
{% endblock %}

{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4">
            <h4 class="mb-4 text-center">Вход в систему</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-hover">Войти</button>
            </form>
            <div class="mt-3 text-center">
                <small>Нет аккаунта? <a href="{% url 'register' %}">Регистрация</a></small>
            </div>
            {% if is_admin_page %}
            <div class="mt-2 text-center"><small><a href="{% url 'home' %}">Обычный вход</a></small></div>
            {% else %}
            <div class="mt-2 text-center"><small><a href="{% url 'admin_login' %}">Вход администратора</a></small></div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
